<style>
  :root{
    --yellow:#FFD21F; --yellow-soft:#FFF3B8; --black:#1A1A1A;
    --cream:#FFFBEF; --green-soft:#E7F3D6; --green-dark:#3d6b12; --muted:#6B6457;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Nunito',system-ui,sans-serif;background:var(--cream);color:var(--black);
    min-height:100vh;display:flex;justify-content:center;overflow-x:hidden}
  .bg-letter{position:fixed;font-family:'Amiri',serif;color:var(--yellow);opacity:.35;pointer-events:none;z-index:0;user-select:none}
  .app{position:relative;z-index:1;width:100%;max-width:460px;padding:20px 18px 28px;display:flex;flex-direction:column;min-height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;letter-spacing:.5px}
  .brand-dot{width:38px;height:38px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;
    font-family:'Amiri',serif;font-size:22px;border:2px solid var(--black)}
  .logo{width:58px;height:58px;border-radius:50%;background:var(--yellow);border:2px solid var(--black);display:grid;place-items:center;flex-shrink:0}
  .logo img{width:72%;height:auto}
  .brand-t{font-size:15px;line-height:1.15;font-weight:900}
  .badge{font-size:11px;font-weight:800;background:var(--black);color:var(--yellow);padding:5px 10px;border-radius:20px}
  .progress{height:10px;background:#fff;border:2px solid var(--black);border-radius:10px;overflow:hidden;margin-bottom:8px}
  .progress span{display:block;height:100%;background:var(--yellow);width:0;transition:width .4s ease}
  .step{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:16px}
  .card{background:#fff;border:2.5px solid var(--black);border-radius:26px;padding:24px 20px;box-shadow:6px 6px 0 var(--black);
    animation:pop .35s ease}
  @keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
  h1{font-size:28px;line-height:1.15;font-weight:900;margin-bottom:12px}
  h1 mark{background:var(--yellow);padding:0 6px;border-radius:8px}
  h2{font-size:22px;line-height:1.25;font-weight:900;margin-bottom:18px}
  h3{font-size:15px;font-weight:900;margin:4px 0 10px}
  p.lead{font-size:16px;line-height:1.5;color:#3a3630;margin-bottom:18px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
  .chip{font-size:13px;font-weight:700;background:var(--yellow-soft);padding:7px 12px;border-radius:20px}
  .proof{display:flex;gap:10px;margin-bottom:20px}
  .proof div{flex:1;background:var(--green-soft);border-radius:14px;padding:10px 8px;text-align:center}
  .proof b{display:block;font-size:20px;font-weight:900;color:var(--green-dark)}
  .proof span{font-size:11px;font-weight:700;line-height:1.25;display:block}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;font:inherit;font-size:16px;font-weight:700;
    background:var(--cream);border:2px solid var(--black);border-radius:16px;padding:14px;cursor:pointer;
    transition:transform .12s, background .15s;color:var(--black)}
  .opt:active{transform:scale(.98)}
  .opt:hover{background:var(--yellow-soft)}
  .opt.sel{background:var(--yellow)}
  .opt .ic{font-size:22px;width:30px;text-align:center;flex-shrink:0}
  .btn{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:900;font-size:17px;
    background:var(--yellow);color:var(--black);border:2.5px solid var(--black);border-radius:18px;padding:16px;
    cursor:pointer;box-shadow:4px 4px 0 var(--black);transition:transform .12s, box-shadow .12s}
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--black)}
  .btn.ghost{background:#fff;margin-top:12px;box-shadow:none;font-size:15px;padding:13px}
  .back{background:none;border:none;font:inherit;font-weight:700;color:var(--muted);margin-top:16px;cursor:pointer;font-size:14px}
  .res-tag{display:inline-block;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1px;
    background:var(--green-soft);color:var(--green-dark);padding:6px 12px;border-radius:20px;margin-bottom:12px}
  .course{background:var(--yellow);border:2px solid var(--black);border-radius:18px;padding:16px;margin:0 0 18px}
  .course b{display:block;font-size:20px;font-weight:900;margin-bottom:6px}
  .course span{font-size:14px;font-weight:600;line-height:1.45}
  .course.extra{background:var(--cream)}
  .course.extra b{font-size:17px}
  ul.tips{list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
  ul.tips li{display:flex;gap:10px;font-size:15px;line-height:1.45}
  ul.tips li::before{content:"✦";color:#d4a800;font-size:16px;flex-shrink:0}
  .note{background:var(--yellow-soft);border-radius:16px;padding:14px;font-size:14px;line-height:1.45;margin-bottom:18px;font-weight:600}
  .gift{background:var(--green-soft);border-radius:16px;padding:14px;font-size:14px;line-height:1.45;margin-bottom:18px;font-weight:600}
  footer{margin-top:auto;padding-top:22px;text-align:center;font-size:11px;color:var(--muted);font-weight:600}
  .hidden{display:none}
</style>
</head>

const MANAGER = "https://bit.ly/4xyTJhE";

const COURSES = {
  main:{b:"«Арабский с Фаида»", s:"Курс разговорного арабского для детей 1,5–12 лет. Мама занимается с ребёнком дома: видеоурок с авторами курса, 5 минут игры в карточки и книга перед сном — всего 15 минут в день. Есть конспект для мамы с огласовками и переводом и куратор в общей группе."},
  fursha:{b:"«Фурша»", s:"Курс по творчеству от носителей языка для детей, уже знакомых с арабским. Укрепляет разговорную речь и развивает ребёнка творчески."},
  words:{b:"Мини-курс «Любимцы детей»", s:"Короткий курс по заучиванию новых слов — быстро пополняет словарный запас."},
  cook:{b:"Мини-курсы «Готовим пиццу» и «Готовим завтрак»", s:"Учим новые слова прямо на кухне — вместе с мамой и с вкусным результатом."},
  lib:{b:"Библиотека «Фаида»", s:"Сокровищница полезных материалов на арабском для занятий дома."}
};

const Q = [
  {id:"age", q:"Сколько лет вашему ребёнку?", o:[
    {t:"1,5 – 3 года", i:"🍼", v:"baby"},
    {t:"3 – 6 лет", i:"🎨", v:"pre"},
    {t:"7 – 9 лет", i:"🎒", v:"school"},
    {t:"10 – 12 лет", i:"📚", v:"teen"}]},
  {id:"level", q:"Ребёнок уже знаком с арабским?", o:[
    {t:"Нет, начинаем с нуля", i:"🌱", v:0},
    {t:"Знает отдельные слова", i:"✏️", v:1},
    {t:"Понимает и говорит простыми фразами", i:"💬", v:2},
    {t:"Уже неплохо говорит", i:"⭐", v:3}]},
  {id:"mom", q:"Вы сами читаете по-арабски?", o:[
    {t:"Да, читаю уверенно", i:"✅", v:"yes"},
    {t:"Читаю медленно, без таджвида", i:"📖", v:"slow"},
    {t:"Пока не читаю", i:"⏳", v:"no"}]},
  {id:"time", q:"Сколько времени в день вы готовы заниматься с ребёнком?", o:[
    {t:"5–10 минут — я весь день занята", i:"⏱️", v:"low"},
    {t:"Около 15 минут", i:"☕", v:"mid"},
    {t:"20 минут и больше", i:"🌟", v:"high"}]},
  {id:"goal", q:"Что для вас сейчас важнее всего?", o:[
    {t:"Чтобы ребёнок заговорил на арабском", i:"💬", v:"speak"},
    {t:"Чтобы полюбил язык — без зубрёжки", i:"💛", v:"love"},
    {t:"Заменить мультики и гаджеты полезным", i:"📵", v:"screen"},
    {t:"Пополнить словарный запас", i:"🧩", v:"vocab"}]},
  {id:"likes", q:"Чем ваш ребёнок любит заниматься?", o:[
    {t:"Играть и двигаться", i:"⚽", v:"play"},
    {t:"Рисовать и мастерить", i:"✂️", v:"art"},
    {t:"Помогать маме на кухне", i:"🍳", v:"cook"},
    {t:"Смотреть мультики", i:"📺", v:"tv"}]}
];

let i = -1; const A = {};
const screen = document.getElementById("screen");

function start(){
  document.getElementById("bar").classList.add("hidden");
  screen.innerHTML = `
  <div class="card">
    <h1>Какой курс <mark>FAIDA</mark> подойдёт вашему ребёнку?</h1>
    <p class="lead">6 коротких вопросов — и вы узнаете, с чего начать арабский дома и какой курс подойдёт именно вашей семье.</p>
    <div class="proof">
      <div><b>800+</b><span>семей уже с нами</span></div>
      <div><b>99%</b><span>родителей: ребёнок заговорил</span></div>
    </div>
    <div class="chips"><span class="chip">⏱ 1 минута</span><span class="chip">🎁 Советы по возрасту</span><span class="chip">💛 Без регистрации</span></div>
    <button class="btn" onclick="next()">Пройти тест</button>
  </div>`;
}

function next(){ i++; i < Q.length ? showQ() : showResult(); }
function prev(){ i--; i < 0 ? (i=-1, start()) : showQ(); }

function showQ(){
  const q = Q[i];
  document.getElementById("bar").classList.remove("hidden");
  document.getElementById("prog").style.width = ((i+1)/Q.length*100)+"%";
  document.getElementById("stepTxt").textContent = `Вопрос ${i+1} из ${Q.length}`;
  screen.innerHTML = `
  <div class="card">
    <h2>${q.q}</h2>
    <div class="opts">${q.o.map((o,k)=>`
      <button class="opt ${A[q.id]===o.v?'sel':''}" onclick="pick(${k},this)"><span class="ic">${o.i}</span>${o.t}</button>`).join("")}
    </div>
  </div>
  <button class="back" onclick="prev()">← Назад</button>`;
}

function pick(k, el){
  A[Q[i].id] = Q[i].o[k].v;
  el.classList.add("sel");
  setTimeout(next, 260);
}

function showResult(){
  document.getElementById("prog").style.width = "100%";
  document.getElementById("stepTxt").textContent = "Готово!";

  // основной курс: с нуля или немного слов — «Арабский с Фаида»; уже говорит — «Фурша»
  const mainKey = A.level >= 2 ? "fursha" : "main";

  // дополнительный курс по интересам и целям
  let extraKey;
  if (A.likes === "cook") extraKey = "cook";
  else if (A.likes === "art" && mainKey !== "fursha" && A.level >= 1) extraKey = "fursha";
  else if (A.goal === "vocab" || A.time === "low") extraKey = "words";
  else if (mainKey === "fursha") extraKey = "main";
  else extraKey = "lib";
  if (extraKey === mainKey) extraKey = "lib";

  const main = COURSES[mainKey], extra = COURSES[extraKey];

  const ageTips = {
    baby:"В 1,5–3 года язык заходит через игру, карточки и повторение — короткого занятия в 5 минут уже достаточно.",
    pre:"В 3–6 лет лучше всего работают игры, движение и карточки — ребёнок учит слова, даже не замечая этого.",
    school:"В 7–9 лет важно сочетать игру и живое общение — интерес легко поддержать маленькими победами.",
    teen:"В 10–12 лет ребёнку важно видеть свой прогресс — разговорная практика каждый день даёт быстрый результат."
  };
  const timeTip = A.time === "low"
    ? "Урок в «Фаида» занимает всего 15 минут: видео, игра в карточки и книга перед сном. А куратор напомнит о новом уроке и поддержит, если будет трудно."
    : "Вашего времени достаточно, чтобы ребёнок уже в первые месяцы начал использовать арабские слова и фразы.";
  const goalTip = {
    speak:"Раз цель — речь, важно, чтобы ребёнок слышал арабский каждый день: на курсе всё на арабском, без перевода.",
    love:"Главное сейчас — радость от занятий: никакой зубрёжки и стресса, только игра и общение с мамой.",
    screen:"Короткие яркие уроки — полезная замена мультикам: ребёнок занят, а вы спокойны за то, что он смотрит.",
    vocab:"Новые слова лучше всего запоминаются в игре и повторении — по чуть-чуть, но каждый день."
  }[A.goal];

  const momNote = {
    yes:"Вы уже готовы учить ребёнка сами: материал пошаговый — просто следуйте за уроками.",
    slow:"Этого достаточно! В конспекте для мамы есть огласовки и перевод — вы справитесь.",
    no:"Для курса маме нужно уметь читать по-арабски. Напишите менеджеру — подскажут, с чего лучше начать."
  }[A.mom];

  screen.innerHTML = `
  <div class="card">
    <div class="res-tag">Ваш результат</div>
    <h2>Вашему ребёнку подойдёт:</h2>
    <div class="course"><b>${main.b}</b><span>${main.s}</span></div>
    <h3>А ещё понравится:</h3>
    <div class="course extra"><b>${extra.b}</b><span>${extra.s}</span></div>
    <div class="note">💡 ${momNote}</div>
    <ul class="tips"><li>${ageTips[A.age]}</li><li>${timeTip}</li><li>${goalTip}</li></ul>
    <div class="gift">🎁 Напишите менеджеру слово <b>«ТЕСТ»</b> и название курса из результата — вам расскажут о старте ближайшего потока.</div>
    <a class="btn" href="${MANAGER}" target="_blank" rel="noopener">Написать менеджеру</a>
    <button class="btn ghost" onclick="restart()">Пройти заново</button>
  </div>`;
}

function restart(){ for (const k in A) delete A[k]; i=-1; start(); }
start();
</script>
</body>
</html>
